<!doctype html>
<html lang="es-MX">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#092645">
<base href="/Conexionlaboral360/crm/">
<title>Compás Fly · Conexión Laboral 360</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="crm-loading" style="min-height:100vh;display:grid;place-items:center;background:#edf2f8;color:#092645;font:600 16px system-ui,sans-serif">Cargando compás fly…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
<script>
(async()=>{try{
const response=await fetch("shell.html",{cache:"no-cache"});
if(!response.ok)throw new Error("No se pudo cargar la interfaz");
document.body.innerHTML=await response.text();
const script=document.createElement("script");script.src="app.js";script.defer=true;
script.onerror=()=>{document.body.textContent="No se pudo iniciar el CRM. Actualiza la página."};
document.body.append(script);
}catch(err){document.getElementById("crm-loading").textContent="No se pudo cargar el CRM. Actualiza la página.";console.error(err?.message||err);}})();
</script>
</body>
</html>
