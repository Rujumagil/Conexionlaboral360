name: CL360 · Mensajes PWA independiente
on:
  push:
    paths:
      - mensajes/**
      - .github/workflows/cl360-mensajes-standalone.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Probar autenticación y toma humana móvil
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE" /tmp/Conexionlaboral360
          cd /tmp
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cl360-standalone.log 2>&1 &
          sleep 2
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const base='http://127.0.0.1:8765/Conexionlaboral360/mensajes/';
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',error=>errors.push(error.message));
            const manifest=await (await page.request.get(base+'manifest.webmanifest')).json();
            if(manifest.name!=='Conexión Laboral 360 · Mensajes de Astrid'||manifest.scope!=='./'||manifest.display!=='standalone')throw Error('PWA sin identidad independiente');
            const icon=await page.request.get(base+'../crm/icon-192.png');
            if(icon.status()!==200)throw Error('Icono no disponible');
            const mockCode=`
              const candidate={id:'c1111111-1111-4111-8111-111111111111',full_name:'Candidata ficticia',phone:'3312345678',job_slug:'obra-sutaj',stage:'new'};
              const thread={id:'d1111111-1111-4111-8111-111111111111',candidate_id:candidate.id,status:'waiting',handler_id:null,fly_session_hash:'test-session-hash',live_chat_enabled:true,last_message_at:'2026-11-24T12:00:00Z'};
              const msgs=[{id:'m1',source:'candidate',body:'Pregunta ficticia',created_at:'2026-11-24T12:00:00Z',conversation_id:thread.id},{id:'m2',source:'fly',body:'Respuesta de Andy',created_at:'2026-11-24T12:01:00Z',conversation_id:thread.id},{id:'m3',source:'system',body:'Resumen de preentrevista ficticio',created_at:'2026-11-24T12:01:30Z',conversation_id:thread.id}];
              window.__writes=0; window.__directSends=0;
              window.supabase={createClient(){return {
                auth:{getUser:async()=>({data:{user:{id:'a78ef7ff-0389-4587-92b2-8e442973888b'}}}),signOut:async()=>({}),signInWithPassword:async()=>({error:null})},
                from(name){const rows={cl360_conversations:[thread],cl360_candidates:[candidate],cl360_jobs:[{slug:'obra-sutaj',title:'Obra Sutaj'}],cl360_chat_messages:msgs};
                  const q={select(){return q},eq(){return q},order(){return q},limit(){return Promise.resolve({data:rows[name]||[],error:null})},maybeSingle(){return Promise.resolve({data:{role:'owner',status:'active'},error:null})},insert(){window.__writes++;return Promise.resolve({error:null})}};return q;},
                rpc:async(name,args)=>{if(name==='cl360_take_conversation'){thread.status=args.p_action==='take'?'human':'waiting';thread.handler_id=thread.status==='human'?'a78ef7ff-0389-4587-92b2-8e442973888b':null;}if(name==='cl360_staff_send_candidate_message'){window.__directSends++;msgs.push({id:'staff-msg',source:'staff',visibility:'candidate',body:args.p_body,created_at:'2026-11-24T12:02:00Z'});}return {data:thread.status,error:null};}
              }}};
            `;
            await page.route('https://cdn.jsdelivr.net/**',route=>route.fulfill({status:200,contentType:'application/javascript',body:mockCode}));
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.locator('#app').waitFor({state:'visible',timeout:15000});
            if(!await page.locator('.filter-chip[data-filter="all"]').isVisible())throw Error('Faltan filtros estilo app');
            await page.locator('[data-filter="waiting"]').click();
            if(await page.locator('.thread').count()!==1)throw Error('Filtro pendientes no muestra el caso');
            await page.locator('[data-filter="human"]').click();
            if(await page.locator('.thread').count()!==0)throw Error('Mis chats muestra conversaciones ajenas');
            await page.locator('[data-filter="all"]').click();
            if(!await page.getByText('Pregunta ficticia').first().isVisible())throw Error('Falta vista previa del chat');
            await page.locator('.thread').first().click();
            await page.getByText('Pregunta ficticia').last().waitFor({state:'visible'});
            if(await page.locator('.timeline').getByText('Resumen de preentrevista ficticio').count())throw Error('Resumen del sistema ocupa el chat');
            await page.locator('#info-toggle').click();
            await page.locator('#context-details').getByText('Preentrevista y eventos').click();
            await page.locator('#context-details').getByText('Resumen de preentrevista ficticio').waitFor({state:'visible'});
            await page.locator('#info-close').click();
            if(!await page.locator('#context-panel').isHidden())throw Error('No se cerró la ficha de candidato');
            if(await page.locator('#reply').isEnabled())throw Error('Campo habilitado sin toma humana');
            await page.getByRole('button',{name:'Tomar conversación'}).click();
            await page.locator('#reply').waitFor({state:'visible'});
            if(!await page.locator('#reply').isEnabled())throw Error('No habilitó respuesta humana');
            await page.locator('#reply').fill('Hola, soy Astrid. Revisemos tu solicitud.');
            const link=await page.locator('#send-whatsapp').getAttribute('href');
            if(!link?.startsWith('https://wa.me/523312345678?text=')||!link.includes('Revisemos'))throw Error('WhatsApp sin mensaje de prueba');
            const writes=await page.evaluate(()=>window.__writes);
            if(writes!==0)throw Error('Se registró un envío que no ocurrió');
            if(!await page.locator('#send-inapp').isEnabled())throw Error('Enviar aquí no disponible con sesión consentida');
            await page.locator('#send-inapp').click();
            await page.getByText('Astrid · enviado en el chat').waitFor({state:'visible'});
            await page.locator('#back').click();
            await page.locator('#inbox-section').waitFor({state:'visible'});
            await page.locator('[data-filter="human"]').click();
            if(await page.locator('.thread').count()!==1)throw Error('Mis chats debe incluir caso tomado');
            const count=await page.evaluate(()=>window.__directSends);
            if(count!==1)throw Error('No se registró el envío directo al chat interno');
            console.log('Ambas opciones: mensaje interno enviado mediante RPC, enlace WhatsApp sin envío automático: OK');
            if(errors.length)throw Error('JavaScript: '+errors.join('; '));
            console.log('OK: nueva interfaz CL360 Mensajes, filtros rápidos, ficha del candidato y doble respuesta');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
