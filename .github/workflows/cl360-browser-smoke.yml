name: CL360 · Prueba visual de acceso al CRM
on:
  push:
    paths:
      - crm/**
      - .github/workflows/cl360-browser-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador de prueba
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Levantar GitHub Pages de manera local
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE" /tmp/Conexionlaboral360
          cd /tmp
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cl360-http.log 2>&1 &
          echo $! > /tmp/cl360-server.pid
          sleep 2
      - name: Verificar que las ocho rutas muestran formulario de acceso
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const executablePath=process.env.CHROME_PATH||'/usr/bin/google-chrome';
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const paths=['','vacantes/','candidatos/','pipeline/','conversaciones/','seguimientos/','fly/','ajustes/'];
            let bad=0;
            for(const route of paths){
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror',err=>errors.push(err.message));
              const url='http://127.0.0.1:8765/Conexionlaboral360/crm/'+route;
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              const login=page.locator('#login-form');
              const hasLogin=await login.count()===1;
              const visible=hasLogin&&await login.isVisible();
              const title=await page.title();
              await page.waitForTimeout(1200);
              const appScript=await page.locator('script[src="app.js"]').count()===1;
              const result={route:route||'dashboard',http:response?.status(),visible,appScript,title,pageErrors:errors.slice(0,3)};
              console.log(JSON.stringify(result));
              if(!visible||!appScript||errors.length)bad++;
              await page.close();
            }
            // Ensayo de navegación autenticada: respuestas simuladas, sin acceso a expedientes reales.
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('https://cdn.jsdelivr.net/**',route=>route.fulfill({
              status:200,contentType:'application/javascript',
              body:`window.supabase={createClient(){return {
                auth:{getUser:async()=>({data:{user:{id:'a78ef7ff-0389-4587-92b2-8e442973888b',email:'cuenta-prueba@example.invalid'}}}),signOut:async()=>({}),signInWithPassword:async()=>({error:null})},
                from(name){
                  const candidate={id:'c1111111-1111-4111-8111-111111111111',full_name:'Candidata ficticia',phone:'3312345678',job_slug:'coto-prueba',area:'Seguridad',experience:'Experiencia ficticia',stage:'new',created_at:'2026-11-24T12:00:00Z',screening_data:{availability:'consultar',experience_level:'no',preferred_zone:'Zapopan'}};
                  window.__testFollowups=window.__testFollowups||[];
                  const rows={cl360_candidates:[candidate],cl360_jobs:[{slug:'coto-prueba',title:'Vacante de prueba',area:'Seguridad',status:'active'}],cl360_followups:window.__testFollowups,cl360_conversations:[]};
                  const q={select(){return q},eq(){return q},order(){return q},limit(){return Promise.resolve({data:rows[name]||[],error:null})},
                    maybeSingle(){return Promise.resolve({data:{role:'owner',status:'active'},error:null})},
                    insert(record){window.__testFollowups.push({...record,id:'f1111111-1111-4111-8111-111111111111'});return Promise.resolve({error:null})}};
                  return q;
                },
                rpc:async()=>({error:null})
              }}};`
            }));
            await page.route('https://qwxydjotwhniahaovrff.supabase.co/functions/v1/cl360-fly-chat',route=>route.fulfill({
              status:200,contentType:'application/json',body:JSON.stringify({ok:true,ready:false,providerConfigured:false})
            }));
            const changes=[];
            page.on('framenavigated',f=>{if(f===page.mainFrame())changes.push(f.url())});
            await page.goto('http://127.0.0.1:8765/Conexionlaboral360/crm/',{waitUntil:'domcontentloaded'});
            await page.locator('#dashboard').waitFor({state:'visible',timeout:15000});
            const initialNavigations=changes.length;
            await page.evaluate(()=>{window.__crmSessionProbe='same-document-session'});

            await page.locator('.mobile-nav [data-nav="vacantes"]').click();
            await page.locator('#view-vacantes').waitFor({state:'visible'});
            await page.locator('.mobile-nav [data-nav="candidatos"]').click();
            await page.locator('#view-candidatos').waitFor({state:'visible'});
            await page.locator('.mobile-nav [data-nav="inicio"]').click();
            await page.locator('#view-inicio').waitFor({state:'visible'});
            await page.locator('#fly-home-alerts').waitFor({state:'visible'});
            if(!await page.locator('#fly-home-alerts .priority-item.new').isVisible())throw Error('Falta prioridad del candidato sin contactar');
            await page.locator('#fly-home-alerts .priority-item.new').getByRole('button',{name:'Programar'}).click();
            await page.locator('.priority-quick-form input[type="text"]').fill('Llamar para confirmar interés');
            await page.locator('.priority-quick-form input[type="datetime-local"]').fill('2026-12-15T10:30');
            await page.locator('.priority-quick-form button[type="submit"]').click();
            await page.locator('#home-followups').getByText('Llamar para confirmar interés').waitFor({timeout:15000});
            if(await page.evaluate(()=>window.__testFollowups.length)!==1)throw Error('No se guardó el seguimiento desde inicio');
            console.log('Dashboard: prioridad y programación de tarea confirmada');
            await page.evaluate(()=>document.querySelector('button[data-nav="fly"]').click());
            await page.locator('#view-fly').waitFor({state:'visible'});
            await page.locator('#fly-history-period').selectOption('7');
            const historical=page.locator('#fly-history-summary .historical-stat');
            if(await historical.count()!==4)throw Error('Faltan métricas históricas');
            if(await page.locator('#fly-history-chart .historical-bar-item').count()!==7)throw Error('Faltan barras del histórico');
            await page.locator('#fly-history-period').selectOption('90');
            if(await page.locator('#fly-history-chart .historical-bar-item').count()!==13)throw Error('El filtro histórico no se actualiza');
            console.log('Histórico: 7 y 90 días correctos');
            for(const id of ['fly-review-list','fly-followup-list','fly-performance']){
              if(!await page.locator('#'+id).isVisible())throw Error('Falta panel interno '+id);
            }
            await page.locator('#fly-agents-refresh').click();
            await page.locator('#fly-agents-updated').waitFor({state:'visible'});
            console.log('Tres asistentes Fly visibles y actualizables sin recargar sesión');
            await page.locator('#crm-alerts-toggle').click();
            if(!await page.locator('#crm-alerts-panel').isVisible())throw Error('Campanita no abre alertas');
            await page.locator('#crm-alerts-close').click();
            if(!await page.locator('#crm-alerts-panel').isHidden())throw Error('Panel de alertas no se cierra');
            console.log('Campanita de alertas: abrir y cerrar OK');
            const stillLoggedIn=await page.locator('#dashboard').isVisible()&&!await page.locator('#auth-screen').isVisible();
            const navigationWithoutReload=await page.evaluate(()=>window.__crmSessionProbe==='same-document-session');
            console.log(JSON.stringify({navigationWithoutReload,stillLoggedIn,historyEvents:changes.length-initialNavigations,latestPath:new URL(page.url()).pathname}));
            if(!navigationWithoutReload||!stillLoggedIn)bad++;
            await page.close();
            await browser.close();
            if(bad)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
