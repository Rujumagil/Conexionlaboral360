name: CL360 · Integridad del asistente y Fly
on:
  push:
    paths:
      - .github/workflows/cl360-integrity.yml
      - crm/**
      - asistente/index.html
      - supabase/functions/cl360-fly-chat/index.ts
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar TypeScript para analizar errores de sintaxis
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Verificar JavaScript de la landing, asistente y CRM
        run: |
          node <<'JS'
          const fs=require('node:fs');
          for(const path of ['index.html','asistente/index.html','crm/index.html']){
            const html=fs.readFileSync(path,'utf8');
            const matches=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g)];
            const scripts=matches.filter(x=>!x[1].includes('src='));
            if(!scripts.length)throw Error('Sin JS: '+path);
            scripts.forEach(x=>{
              const ts=require('typescript');
              const syntax=ts.createSourceFile(path+'.js',x[2],ts.ScriptTarget.Latest,true,ts.ScriptKind.JS);
              for(const error of syntax.parseDiagnostics){
                const loc=syntax.getLineAndCharacterOfPosition(error.start);
                console.error(path+' línea '+(loc.line+1)+': '+ts.flattenDiagnosticMessageText(error.messageText,' '));
              }
              if(syntax.parseDiagnostics.length){
                for(const node of syntax.statements){
                  const start=syntax.getLineAndCharacterOfPosition(node.getStart(syntax));
                  const end=syntax.getLineAndCharacterOfPosition(node.getEnd());
                  console.error('Nodo raíz:',ts.SyntaxKind[node.kind],start.line+1,'→',end.line+1,JSON.stringify(node.getText(syntax).slice(0,65)));
                }
                throw Error('Error de sintaxis: '+path);
              }
              new Function(x[2]);
            });
            console.log('JavaScript correcto:',path);
          }
          const app=fs.readFileSync('crm/app.js','utf8');
          const shell=fs.readFileSync('crm/shell.html','utf8');
          const styles=fs.readFileSync('crm/app.css','utf8');
          new Function(app);
          if(/\bnew URL\(/.test(app)&&app.includes('const URL="https://'))
            throw Error('Conflicto entre URL de Supabase y constructor de rutas');
          if(!app.includes('new window.URL("./",document.baseURI)'))
            throw Error('Falta constructor correcto de rutas');

          const pages=['inicio','vacantes','candidatos','pipeline','conversaciones','seguimientos','fly','ajustes'];
          for(const page of pages){
            const path=page==='inicio'?'crm/index.html':'crm/'+page+'/index.html';
            const html=fs.readFileSync(path,'utf8');
            if(!html.includes('app.css')||!html.includes('app.js')||!html.includes('shell.html'))
              throw Error('Ruta con módulos compartidos incompletos: '+path);
            if(!shell.includes('data-view="'+page+'"'))throw Error('Vista ausente: '+page);
          }
          if(!app.includes('location.assign(urlForView(view,candidateId).href)'))
            throw Error('Navegación de páginas independientes ausente');
          if(!['kpi-open-jobs','kpi-waiting','kpi-human','kpi-hired'].every(x=>shell.includes(x)&&app.includes(x)))
            throw Error('Dashboard de KPIs incompleto');
          if(!styles.includes('.dashboard-secondary-kpis'))throw Error('Estilos dashboard ausentes');
          console.log('Ocho páginas y dashboard de KPIs: correctos');
          const landing=fs.readFileSync('index.html','utf8');
          const chat=fs.readFileSync('asistente/index.html','utf8');
          const edge=fs.readFileSync('supabase/functions/cl360-fly-chat/index.ts','utf8');
          if(!landing.includes('asistente/?vacante='))throw Error('Falta enlace contextual a vacante');
          if(!chat.includes('id="fly-consent"'))throw Error('Falta consentimiento de preguntas libres');
          if(!chat.includes('functions/v1/cl360-fly-chat'))throw Error('Falta conexión con Fly');
          if(!chat.includes('await reply(answerQuestion(question))'))throw Error('Falta respaldo guiado');
          if(!edge.includes('store:false'))throw Error('Falta solicitud de no almacenamiento');
          if(!edge.includes('cl360_fly_take_turn'))throw Error('Falta límite del servidor');
          console.log('Reglas básicas del contrato: correctas');
          JS
      - name: Compilar función TypeScript sin ejecutarla
        run: |
          cat > /tmp/cl360-deno-globals.d.ts <<'TS'
          declare const Deno: {
            env: {get(key:string):string|undefined};
            serve(handler:(request:Request)=>Response|Promise<Response>):void;
          };
          TS
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --lib ES2022,DOM --target ES2022 --module esnext --strict false /tmp/cl360-deno-globals.d.ts supabase/functions/cl360-fly-chat/index.ts
          echo "Backend TypeScript correcto"
