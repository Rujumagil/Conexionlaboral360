name: CL360 · Integridad del asistente y Fly
on:
  push:
    paths:
      - .github/workflows/cl360-integrity.yml
      - crm/**
      - asistente/index.html
      - supabase/functions/cl360-fly-chat/index.ts
      - supabase/functions/cl360-apply/index.ts
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar TypeScript para analizar errores de sintaxis
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Verificar JavaScript de la landing, asistente y CRM
        run: |
          node <<'JS'
          const fs=require('node:fs');
          for(const path of ['index.html','asistente/index.html']){
            const html=fs.readFileSync(path,'utf8');
            const matches=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g)];
            const scripts=matches.filter(x=>!x[1].includes('src='));
            if(!scripts.length)throw Error('Sin JS: '+path);
            scripts.forEach(x=>{
              const ts=require('typescript');
              const syntax=ts.createSourceFile(path+'.js',x[2],ts.ScriptTarget.Latest,true,ts.ScriptKind.JS);
              for(const error of syntax.parseDiagnostics){
                const loc=syntax.getLineAndCharacterOfPosition(error.start);
                console.error(path+' línea '+(loc.line+1)+': '+ts.flattenDiagnosticMessageText(error.messageText,' '));
              }
              if(syntax.parseDiagnostics.length){
                for(const node of syntax.statements){
                  const start=syntax.getLineAndCharacterOfPosition(node.getStart(syntax));
                  const end=syntax.getLineAndCharacterOfPosition(node.getEnd());
                  console.error('Nodo raíz:',ts.SyntaxKind[node.kind],start.line+1,'→',end.line+1,JSON.stringify(node.getText(syntax).slice(0,65)));
                }
                throw Error('Error de sintaxis: '+path);
              }
              new Function(x[2]);
            });
            console.log('JavaScript correcto:',path);
          }
          const app=fs.readFileSync('crm/app.js','utf8');
          const first=app.indexOf('function candidateReviewNotes(candidate)');
          const end=app.indexOf('const stageNames=',first);
          if(first<0||end<0||!app.includes('id="copy-andy-summary"')||!app.includes('navigator.clipboard.writeText(candidateIntakeSummary(candidate))'))
            throw Error('Resumen verificable de Andy ausente del expediente');
          const helpers=app.slice(first,end);
          const evaluate=new Function('jobs','fmt',helpers+';return candidateIntakeSummary;');
          const summarize=evaluate([{slug:'test-job',title:'Puesto de prueba',area:'Seguridad',location:'Zona verificada',shift:'Turno verificado'}],()=> 'Fecha de prueba');
          const record={full_name:'Candidata ficticia',phone:'3312345678',job_slug:'test-job',area:'Seguridad',experience:'Atención a clientes',created_at:'2026-11-24T12:00:00Z',screening_data:{experience_level:'no',availability:'no',preferred_zone:'Zapopan'}};
          const summary=summarize(record);
          for(const expected of ['Candidata ficticia','3312345678','Puesto de prueba','Atención a clientes','Indica que el turno no le funciona','explorar alternativas','Pendiente de revisión humana']){
            if(!summary.includes(expected))throw Error('Resumen de Andy incompleto: '+expected);
          }
          if(/(apto|rechazad[oa]|calificaci[oó]n de idoneidad)/i.test(summary))
            throw Error('No emitir veredictos de selección');
          const incomplete=summarize({...record,screening_data:{}});
          if(!incomplete.includes('Por confirmar')||!incomplete.includes('Zona preferida sin especificar'))
            throw Error('El resumen debe mostrar vacíos sin inventar respuestas');
          console.log('Resumen de preentrevista Andy: validado con datos ficticios');
          const shell=fs.readFileSync('crm/shell.html','utf8');
          const styles=fs.readFileSync('crm/app.css','utf8');
          new Function(app);
          if(/\bnew URL\(/.test(app)&&app.includes('const URL="https://'))
            throw Error('Conflicto entre URL de Supabase y constructor de rutas');
          if(!app.includes('new window.URL("./",document.baseURI)'))
            throw Error('Falta constructor correcto de rutas');

          const pages=['inicio','vacantes','candidatos','pipeline','conversaciones','seguimientos','fly','ajustes'];
          for(const page of pages){
            const path=page==='inicio'?'crm/index.html':'crm/'+page+'/index.html';
            const html=fs.readFileSync(path,'utf8');
            if(!html.includes('app.css')||!html.includes('app.js')||!html.includes('id="login-form"'))
              throw Error('Ruta sin estilos, app o formulario de acceso directo: '+path);
            if(html.includes('fetch("shell.html"')||html.includes('id="crm-loading"'))
              throw Error('No usar montaje asíncrono que pueda causar pantalla blanca: '+path);
            if(!shell.includes('data-view="'+page+'"'))throw Error('Vista ausente: '+page);
          }
          // Los tres asistentes comparten la misma base y están presentes en las ocho rutas.
          for(const page of pages){
            const path=page==='inicio'?'crm/index.html':'crm/'+page+'/index.html';
            const html=fs.readFileSync(path,'utf8');
            for(const id of ['fly-review-list','fly-followup-list','fly-performance','fly-home-alerts','fly-agents-refresh']){
              if(!html.includes('id="'+id+'"'))throw Error('Panel Fly ausente: '+id+' en '+path);
            }
          }
          for(const helper of ['flyInsightsAt','renderFlyAgents','candidateReviewNotes']){
            if(!app.includes('function '+helper+'('))throw Error('Asistente interno ausente: '+helper);
          }
          const insightsCode=app.slice(app.indexOf('function flyInsightsAt('),app.indexOf('function flyActionRow('));
          const calc=new Function('candidates','followups',insightsCode+';return flyInsightsAt;');
          const sample=calc(
            [{id:'a',stage:'new',created_at:'2026-11-23T12:00:00Z'},{id:'b',stage:'hired',created_at:'2026-11-10T12:00:00Z'}],
            [{id:'f1',status:'pending',due_at:'2026-11-22T12:00:00Z'},
             {id:'f2',status:'pending',due_at:'2026-11-25T00:00:00Z'},
             {id:'f3',status:'done',due_at:'2026-11-21T00:00:00Z'}]
          ) (new Date('2026-11-24T12:00:00Z').getTime());
          if(sample.overdue.length!==1||sample.dueSoon.length!==1||sample.doneCount!==1||sample.newCandidates.length!==1||sample.registered7!==1||sample.hiredCount!==1)
            throw Error('Cálculo erróneo de pendientes, vencimientos o métricas');
          console.log('Tres asistentes internos y alertas: correctos');
          if(!app.includes('history.pushState')||!app.includes('addEventListener("popstate"'))
            throw Error('La navegación debe conservar sesión y respetar Atrás');
          if(app.includes('location.assign(urlForView('))
            throw Error('Recarga completa detectada al cambiar pestaña');
          if(!['kpi-open-jobs','kpi-waiting','kpi-human','kpi-hired'].every(x=>shell.includes(x)&&app.includes(x)))
            throw Error('Dashboard de KPIs incompleto');
          if(!styles.includes('.dashboard-secondary-kpis'))throw Error('Estilos dashboard ausentes');
          console.log('Ocho páginas y dashboard de KPIs: correctos');
          const landing=fs.readFileSync('index.html','utf8');
          const chat=fs.readFileSync('asistente/index.html','utf8');
          const edge=fs.readFileSync('supabase/functions/cl360-fly-chat/index.ts','utf8');
          if(!landing.includes('asistente/?vacante='))throw Error('Falta enlace contextual a vacante');
          if(!chat.includes('id="fly-consent"'))throw Error('Falta consentimiento de preguntas libres');
          if(!chat.includes('functions/v1/cl360-fly-chat'))throw Error('Falta conexión con Fly');
          if(!chat.includes('await reply(answerQuestion(question))'))throw Error('Falta respaldo guiado');
          if(!edge.includes('store:false'))throw Error('Falta solicitud de no almacenamiento');
          if(!edge.includes('cl360_fly_take_turn'))throw Error('Falta límite del servidor');
          if(!edge.includes('cl360_fly_record_turn')||!edge.includes('cl360_fly_session_state'))
            throw Error('Falta historial Fly autenticado o control de toma humana');
          const apply=fs.readFileSync('supabase/functions/cl360-apply/index.ts','utf8');
          if(!apply.includes('cl360_fly_attach_session')||!chat.includes('flyConsent:flyUsedWithConsent'))
            throw Error('Falta vínculo entre entrevista Fly y candidato');
          console.log('Reglas básicas del contrato: correctas');
          JS
      - name: Compilar función TypeScript sin ejecutarla
        run: |
          cat > /tmp/cl360-deno-globals.d.ts <<'TS'
          declare const Deno: {
            env: {get(key:string):string|undefined};
            serve(handler:(request:Request)=>Response|Promise<Response>):void;
          };
          TS
          for fn in cl360-fly-chat cl360-apply; do
            ./node_modules/.bin/tsc --noEmit --skipLibCheck --lib ES2022,DOM --target ES2022 --module esnext --strict false /tmp/cl360-deno-globals.d.ts "supabase/functions/$fn/index.ts"
            echo "TypeScript correcto: $fn"
          done
          echo "Backend TypeScript correcto"
