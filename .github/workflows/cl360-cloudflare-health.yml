name: CL360 · Validación del proveedor Fly en Cloudflare
on:
  push:
    paths:
      - .github/workflows/cl360-cloudflare-health.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Consultar disponibilidad sin credenciales ni datos personales
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          urls=[
             "https://eco.proyectocompas.app/api/public/fly-sales/chat",
             "https://compas-evolution.proyectocompas-info.workers.dev/api/public/fly-sales/chat"
          ]
          for url in urls:
              print("Dominio:",url.split("/")[2])
              try:
                  req=urllib.request.Request(url,headers={"Accept":"application/json"},method="GET")
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=json.loads(response.read(4096))
                      print("HTTP:",response.status)
                      print("API operativa:",bool(data.get("ok")))
                      print("Gemini configurado:",bool(data.get("geminiConfigured")))
                      print("Fly Sales activo:",bool(data.get("live")))
              except urllib.error.HTTPError as e:
                  print("HTTP:",e.code)
                  try:
                      info=json.loads(e.read(4096))
                      print("Gemini configurado:",bool(info.get("geminiConfigured")))
                  except Exception: pass
              except Exception as e:
                  print("Fallo de red:",type(e).__name__)
          PY
