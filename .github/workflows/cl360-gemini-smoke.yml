name: CL360 · Prueba controlada Fly Gemini
on:
  push:
    paths:
      - .github/workflows/cl360-gemini-smoke.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar disponibilidad real y una respuesta ficticia
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, uuid, urllib.request, urllib.error, pathlib
          source=pathlib.Path("crm/app.js").read_text()
          publishable=re.search(r'const KEY="([^"]+)"',source).group(1)
          url="https://qwxydjotwhniahaovrff.supabase.co/functions/v1/cl360-fly-chat"
          headers={"Origin":"https://rujumagil.github.io","apikey":publishable,"content-type":"application/json"}
          req=urllib.request.Request(url,headers=headers,method="GET")
          with urllib.request.urlopen(req,timeout=25) as res: status=json.load(res)
          print("Servidor operativo:", bool(status.get("ok")))
          print("Gemini configurado:", bool(status.get("providerConfigured")))
          print("Fly habilitado supervisado:",bool(status.get("ready") and status.get("supervised")))
          if not status.get("ready"):raise SystemExit("Fly no listo")
          payload={"consent":True,"sessionId":str(uuid.uuid4()),"jobSlug":"coto-magnolias",
                   "message":"Prueba técnica sin datos personales: ¿en qué zona está Coto Magnolias?",
                   "history":[]}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method="POST")
          try:
            with urllib.request.urlopen(req,timeout=40) as res:
              body=json.load(res)
              print("Respuesta HTTP:",res.status)
              print("Respuesta generada:",bool(body.get("ok") and body.get("reply") and body.get("ai")))
              print("Extensión:",len(body.get("reply","")))
              if not body.get("ok") or not body.get("reply"):raise SystemExit("Sin respuesta del modelo")
          except urllib.error.HTTPError as exc:
            try: error=json.load(exc)
            except: error={}
            print("Respuesta HTTP:",exc.code)
            print("Error controlado:",error.get("error","unknown"))
            raise SystemExit(1)
          PY
